<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MAP Career Assist</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <div><span>MAP</span><strong>CAREER ASSIST</strong></div>
        <i>随岗位自动更新</i>
      </header>
      <nav class="mode-tabs" aria-label="扩展功能"><button id="mode-job" class="active" type="button">保存岗位</button><button id="mode-autofill" type="button">自动填表</button></nav>

      <section id="job-mode">
        <section id="status" class="status" role="status">正在读取当前 LinkedIn 岗位…</section>
        <form id="job-form" hidden>
          <label><span>岗位</span><input id="role" required autocomplete="off" /></label>
          <label><span>公司</span><input id="company" required autocomplete="organization" /></label>
          <label><span>地点</span><input id="location" autocomplete="off" /></label>
          <div class="two-column">
            <label><span>阶段</span><select id="stage"><option>已投</option><option>面试</option><option>Offer</option><option>拒绝</option></select></label>
            <label><span>投递日期</span><input id="date" type="date" required /></label>
          </div>
          <label><span>职位链接</span><input id="link" type="url" required /></label>
          <label><span>岗位描述</span><textarea id="description" rows="13"></textarea></label>
          <p class="stage-note">MAP 的看板从「已投」开始。如果你还没真正提交申请，请先保留预览，投递后再确认保存。</p>
          <div class="actions"><button id="refresh" class="retry" type="button" title="读取异常时手动重试" aria-label="手动重新读取">↻</button><button type="submit" value="preview">先预览</button><button class="primary" type="submit" value="save">直接保存</button></div>
        </form>
        <section class="privacy"><strong>本地直达</strong><p>扩展不会调用 AI，也不会自己连接数据库。“直接保存”仍由已登录的 MAP 页面校验和去重。</p></section>
      </section>

      <section id="autofill-mode" hidden>
        <section id="autofill-status" class="status" role="status">正在检查当前网站和本地资料…</section>
        <div class="autofill-hero"><span>FORM ASSIST</span><h2>申请表出现在哪里，<br />资料就跟到哪里。</h2><p>规则匹配在本地完成，不调用 AI，也不会自动提交。</p></div>
        <button id="fill-page" class="autofill-primary" type="button">填写当前页面</button>
        <label class="site-follow"><span><strong>在这个网站持续填写</strong><small id="site-label">只对当前招聘网站生效</small></span><input id="auto-site" type="checkbox" role="switch" /></label>
        <button id="edit-profile" class="profile-button" type="button"><span><strong>编辑我的申请资料</strong><small id="profile-summary">姓名、联系方式、地址、链接和学历</small></span><i>→</i></button>
        <section class="autofill-boundary"><strong>始终由你完成</strong><p>简历上传、密码、SIN/SSN、出生日期、人口统计、薪资、签名以及最后的 Submit。</p></section>
      </section>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
